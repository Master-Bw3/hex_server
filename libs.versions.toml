# This file is a version catalog - a central place where you can declare all of your dependencies and their versions.
# In your build scripts, you can reference it with the `libs` accessor. For example: `libs.hexcasting.fabric`
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
java = "21" # must be an integer

kotlin        = "2.2.21"
kotlin-fabric = "1.13.7+kotlin.2.2.21"
kotlin-forge  = "4.10.0"

# Minecraft

minecraft = "1.21.1"
yarn      = "1.21.1+build.3"

cloche = "0.18.15"

fabric-loader = "0.19.3"
fabric-api    = "0.116.12"

forge            = "1.20.1-47.2.0"
forge-dependency = "47" # for mods.toml

# mods

hexcasting    = "0.12.0-devel-pre-4"
paucal = "0.7.1-pre-27+1.21.1-common"
paucal-fabric = "0.7.1-pre-27+1.21.1-fabric"
paucal-forge  = "0.7.1-pre-27+1.21.1-forge"
inline = "1.21.1-1.2.2"

patchouli        = "1.21.1-90"
patchouli-fabric = "1.21.1-90-FABRIC" # thanks vazkii
patchouli-forge  = "1.21.1-90-FORGE"

cardinalComponents = "6.1.3"
serializationHooks = "0.4.99999"
mixinExtras        = "0.1.1"
clothConfig        = "15.0.130"
modMenu            = "7.1.0"

hexdebug = "0.2.2+1.20.1"

# other dependencies

shadow = "9.4.2"
modPublish = "0.5.1"

ktor = "3.4.1"
coroutines = "1.10.2"

[bundles]
ktor = ["ktor-server-core", "ktor-server-jetty-jakarta", "ktor-server-websockets" ]
coroutines = ["coroutines", "coroutines-jvm"]

[libraries]
kotlin-stdlib = { module="org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref="kotlin" }
kotlin-fabric = { module="net.fabricmc:fabric-language-kotlin", version.ref="kotlin-fabric" }
kotlin-forge  = { module="thedarkcolour:kotlinforforge", version.ref="kotlin-forge" }

minecraft = { module="com.mojang:minecraft", version.ref="minecraft" }
yarn      = { module="net.fabricmc:yarn", version.ref="yarn" }

fabric-loader = { module="net.fabricmc:fabric-loader", version.ref="fabric-loader" }
fabric-api    = { module="net.fabricmc.fabric-api:fabric-api", version.ref="fabric-api" }

forge = { module="net.minecraftforge:forge", version.ref="forge" }

hexcasting-common = { module="at.petra-k.hexcasting:hexcasting-common-1.21.1", version.ref="hexcasting" }
hexcasting-fabric = { module="at.petra-k.hexcasting:hexcasting-fabric-1.21.1", version.ref="hexcasting" }
hexcasting-forge  = { module="at.petra-k.hexcasting:hexcasting-forge-1.21.1", version.ref="hexcasting" }

paucal-common = { module = "at.petra-k:paucal", version.ref = "paucal" }
paucal-fabric = { module = "at.petra-k:paucal", version.ref = "paucal-fabric" }
paucal-forge  = { module = "at.petra-k:paucal", version.ref = "paucal-forge" }

patchouli-xplat  = { module="vazkii.patchouli:Patchouli-xplat", version.ref="patchouli" }
patchouli-fabric = { module="vazkii.patchouli:Patchouli", version.ref="patchouli-fabric" }
patchouli-forge  = { module="vazkii.patchouli:Patchouli", version.ref="patchouli-forge" }

cardinalComponents-base = { module="org.ladysnake.cardinal-components-api:cardinal-components-base", version.ref="cardinalComponents" }
cardinalComponents-entity = { module="org.ladysnake.cardinal-components-api:cardinal-components-entity", version.ref="cardinalComponents" }
cardinalComponents-item = { module="org.ladysnake.cardinal-components-api:cardinal-components-item", version.ref="cardinalComponents" }
cardinalComponents-block = { module="org.ladysnake.cardinal-components-api:cardinal-components-block", version.ref="cardinalComponents" }

mixinExtras        = { module="com.github.LlamaLad7:MixinExtras", version.ref="mixinExtras" }
modMenu            = { module="com.terraformersmc:modmenu", version.ref="modMenu" }

clothConfig-common = { module="me.shedaniel.cloth:cloth-config", version.ref="clothConfig" }
clothConfig-fabric = { module="me.shedaniel.cloth:cloth-config-fabric", version.ref="clothConfig" }
clothConfig-forge  = { module="me.shedaniel.cloth:cloth-config-forge", version.ref="clothConfig" }

hexdebug-fabric = { module="gay.object.hexdebug:hexdebug-fabric", version.ref="hexdebug"}
hexdebug-forge = { module="gay.object.hexdebug:hexdebug-forge", version.ref="hexdebug"}

inline-fabric = { module="com.samsthenerd.inline:inline-fabric", version.ref="inline" }
inline-forge  = { module="com.samsthenerd.inline:inline-forge", version.ref="inline" }


ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-jetty-jakarta = { module = "io.ktor:ktor-server-jetty-jakarta", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets-jvm", version.ref = "ktor" }

coroutines = { module="org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref="coroutines"}
coroutines-jvm = { module="org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref="coroutines"}

serializationHooks = { module="libs:serialization-hooks", version.ref="serializationHooks" }

[plugins]
kotlin-jvm = { id="org.jetbrains.kotlin.jvm", version.ref="kotlin" }

shadow     = { id="com.gradleup.shadow", version.ref="shadow" }
modPublish = { id="me.modmuss50.mod-publish-plugin", version.ref="modPublish" }

cloche = { id="earth.terrarium.cloche", version.ref="cloche"}